<!doctype html>
<html lang="nb">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#030027" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f6f8fd" media="(prefers-color-scheme: light)" />
		<meta name="color-scheme" content="dark light" />
		<script>document.documentElement.classList.add("js")</script>
		<link rel="icon" href="/assets/Kavin_logo.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.png" />

		<!-- Fontene ligger på egen server (importeres i src/app.css) -->

		<!-- Besøksstatistikk: https://kavin.goatcounter.com (uten cookies) -->
		<script
			data-goatcounter="https://kavin.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
